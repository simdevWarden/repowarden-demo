# Réglages repowarden du projet (versionnés, appliqués aux hooks ET à la CI).
# Format git config. Toutes les clés sont optionnelles.
[repowarden]
    # Version minimale de repowarden attendue sur les postes (avertissement sinon)
    version = 4
    # Langue des messages en CI (sur les postes : celle choisie à l'installation)
    lang = fr
    # Flux develop → main : le travail s'intègre dans develop (préversions),
    # seul develop entre dans main (livraison, production)
    integrationBranch = develop
    protectedBranches = main develop
    allowedBranches = main develop livraison/* release-please--* dependabot/*
    # Livraison automatique : la GitHub App merge la PR de livraison dès que ses
    # vérifications sont vertes (release.yml : delivery-auto)
    deliveryApproval = auto
    # Exceptions au nommage <type>/<sujet>
    # allowedBranches = main develop release/*
    # Branches où le commit direct est interdit
    # protectedBranches = main develop
    # Étapes / langages désactivés (branch-name, protect-branch, secrets, format, tests, node…)
    # skip = python
    # Commandes remplaçant la détection automatique
    # format = npm run format --
    # test = make ci
